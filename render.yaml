services:
  - type: web
    name: finchain-rag-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_CHAT_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: finchain-rag-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/ui/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_BASE_URL
        sync: false
